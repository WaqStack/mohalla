version: 2

# Grouped weekly updates. Ungrouped daily PRs would drown a two-person team and
# get ignored, which is worse than a slower cadence that actually gets reviewed.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
