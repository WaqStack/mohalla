name: Android

# Builds the Android application and runs the JVM-side localization and RTL
# checks. No emulator: emulator jobs need nested virtualization and are slow,
# and the checks that matter here - string parity and supportsRtl - are
# verifiable on the JVM.
#
# On-device RTL verification remains a manual gate before release. It is NOT
# claimed to be covered by this workflow.

on:
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']

# Least privilege (public repo): the default token is read-only for every job.
# No job here needs write access - CI only builds and tests. A job that ever
# needs more must request it explicitly at the JOB level, never here.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Least privilege at the JOB level: this job only reads the repo.
    permissions:
      contents: read
    name: Assemble debug and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localization parity and supportsRtl
        run: ./gradlew test --no-daemon --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mohalla-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
