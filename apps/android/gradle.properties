# JVM sizing for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel and cached builds - two developers on modest machines.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required; Support Library is long dead.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Keep the build deterministic: no automatic SDK component downloads that would
# silently pull a version other than the pinned one.
android.builder.sdkDownload=false
